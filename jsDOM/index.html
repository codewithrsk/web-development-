<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="icon" href="./image.png">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container gap-3 mt-5 boder rounded shadow p-4 w-50 justify-content-center align-items-center">
      <input
        type="text"
        id="fullname"
        placeholder="Enter your name"
        class="form-control m-2"
      />
      <input
        type="tel"
        id="phone"
        placeholder="Enter your phone number"
        class="form-control m-2"
      />
      <input
        type="email"
        id="mail"
        placeholder="Enter your email"
        class="form-control m-2"
      />
      <input
        type="text"
        id="age"
        placeholder="Enter your age"
        class="form-control m-2"
      />
      <input
        type="text"
        id="country"
        placeholder="Enter your country"
        class="form-control m-2"
      />
      <button
        class="btn btn-primary  gap-3 mt-5  justify-content-center align-content-center"
        onclick="Submit()"
      >
        Submit
      </button>
    </div>
    <hr />
    <div class="border rounded shadow container p-2 divHide w-50" id="dataCard">
      <span>Name : </span>
      <span id="myData1"> </span>
      <br />
      <span>Number : </span>
      <span id="myData2"> </span>
      <br />
      <span>Email : </span>
      <span id="myData3"> </span>
      <br />
      <span>Age</span>
      <span id="myData4"> </span>
      <br />
      <span>Country : </span>
      <span id="myData5"> </span>
    </div>
    <!-- scripts -->

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
