<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div id="navbar">
        <h1><img src="./logo-2.png" alt="ricrlogo"  width="150px"/></h1>
        <div class="navlinks">
          <span>Home</span>
          <span>About</span>
          <span>Courses</span>
          <span>IDE</span>
          <span>Contact us</span>
        </div>
        <div class="navlinks">
          <a href="tel: +916202406530" id="call">+916202406530</a>
          <button>Student Login</button>
        </div>
      </div>
    </header>
    <main>
      <div id="maindiv" >
        <h1>Enquiry Form</h1>
        <p class="subtitle">
          Have questions or need assistance? Fill out the form below to connect
          with our team and explore your opportunities.
        </p>

        <form>
          <div class="row">
            <div class="input-group">
              <label>Person Name*</label>
              <input type="text" placeholder="Person Name" />
            </div>
            <div class="input-group">
              <label>Contact Number*</label>
              <input type="text" placeholder="Contact Number" />
            </div>
          </div>

          <div class="row">
            <div class="input-group">
              <label>Email*</label>
              <input type="email" placeholder="Email" />
            </div>
            <div class="input-group">
              <label>Qualification*</label>
              <input type="text" placeholder="Qualification" />
            </div>
          </div>

          <div class="row">
            <div class="input-group full">
              <label>College/School Name*</label>
              <input type="text" placeholder="College/School Name" />
            </div>
          </div>

          <div class="row">
            <div class="input-group">
              <label>Year*</label>
              <select>
                <option>Year</option>
                <option>1st Year</option>
                <option>2nd Year</option>
                <option>3rd Year</option>
                <option>4th Year</option>
              </select>
            </div>
            <div class="input-group">
              <label>Branch*</label>
              <input type="text" placeholder="Branch" />
            </div>
          </div>

          <div class="row">
            <div class="input-group">
              <label>Interested in Which Course*</label>
              <div class="checkbox-group">
                <label
                  ><input type="checkbox" /> Full Stack Web Development -
                  Placement Oriented</label
                >
                <label
                  ><input type="checkbox" /> Data Science with Python -
                  Placement Oriented</label
                >
                <label
                  ><input type="checkbox" /> Data Analytics with Python -
                  Placement Oriented</label
                >
                <label><input type="checkbox" /> Business Analyst</label>
              </div>
            </div>

            <div class="input-group">
              <label>Source of Information</label>
              <p>(Only choose 'Received call from institute' if you actually got
                a call from us)*</p>
              
              <select>
                <option>Source of Information</option>
                <option>Google</option>
                <option>Social Media</option>
                <option>Friend</option>
                <option>Received Call</option>
              </select>
            </div>
          </div>

          <button type="submit">Submit</button>
        </form>
      </div>
    </main>
  </body>
</html>
