<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Calculator</title>
    <link rel="icon" type="image" href="logo.png" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="calculator">
      <div class="screen" id="display">0</div>

      <div class="button-area">
        <div class="container-fluid p-0">
          <div class="row g-3 mb-3">
            <div class="col-3">
              <button class="calc-btn" onclick="clearDisplay()">AC</button>
            </div>

            <div class="col-3">
              <button class="calc-btn" onclick="deleteLast()">c</button>
            </div>

            <div class="col-3">
              <button class="calc-btn" onclick="appendValue('%')">%</button>
            </div>

            <div class="col-3">
              <button class="calc-btn operator" onclick="appendValue('/')">
                /
              </button>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-3">
              <button class="calc-btn" onclick="appendValue('7')">7</button>
            </div>

            <div class="col-3">
              <button class="calc-btn" onclick="appendValue('8')">8</button>
            </div>

            <div class="col-3">
              <button class="calc-btn" onclick="appendValue('9')">9</button>
            </div>

            <div class="col-3">
              <button class="calc-btn operator" onclick="appendValue('*')">
                *
              </button>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-3">
              <button class="calc-btn" onclick="appendValue('4')">4</button>
            </div>

            <div class="col-3">
              <button class="calc-btn" onclick="appendValue('5')">5</button>
            </div>

            <div class="col-3">
              <button class="calc-btn" onclick="appendValue('6')">6</button>
            </div>

            <div class="col-3">
              <button class="calc-btn operator" onclick="appendValue('-')">
                -
              </button>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-3">
              <button class="calc-btn" onclick="appendValue('1')">1</button>
            </div>

            <div class="col-3">
              <button class="calc-btn" onclick="appendValue('2')">2</button>
            </div>

            <div class="col-3">
              <button class="calc-btn" onclick="appendValue('3')">3</button>
            </div>

            <div class="col-3">
              <button class="calc-btn operator" onclick="appendValue('+')">
                +
              </button>
            </div>
          </div>

          <div class="row g-3">
            <div class="col-3">
              <button class="calc-btn" onclick="appendValue('0')">0</button>
            </div>

            <div class="col-3">
              <button class="calc-btn" onclick="appendValue('.')">.</button>
            </div>

            <div class="col-6">
              <button class="equal-btn" onclick="calculate()">=</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
