    <h2>Task 7 – Block Layout Table</h2>
    <h3>Description:</h3>
    <p>Table arranged like blocks/boxes using merged cells.</p>
    <p>Tags Used:</p>
    <ul>
      <li>table</li>
      <li>colspan</li>
      <li>rowspan</li>
      <li>td</li>
    </ul>
    <hr>
    <table border="1" cellpadding="20">
      <tr>
        <td colspan="2">A</td>
        <td rowspan="3">B</td>
      </tr>
      <tr>
        <td rowspan="2">C</td>
        <td>D</td>
      </tr>
      <tr>
        <td>E</td>
      </tr>
    </table>

    <table border="1" cellpadding="20">
      <tr>
        <td rowspan="3">1</td>
        <td>2</td>
        <td>3</td>
        <td rowspan="3">4</td>
      </tr>
      <tr>
        <td colspan="2">5</td>
      </tr>
      <tr>
        <td>6</td>
        <td>7</td>
      </tr>
    </table>
