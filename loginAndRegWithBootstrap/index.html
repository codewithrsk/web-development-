<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login And Register</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="bg-primary">
    <div
      class="d-flex d-lg-grid align-items-end justify-content-center vh-100 pb-5 gap-5"
    >
      <div
        class="bg-light d-grid gap-4 p-4 align-items-center justify-content-center rounded-2 me-5 mb-5"
      >
        <h3 class="mb-3">
          <span
            class="bg-light text-decoration-underline link-underline-primary"
          >
            Lo</span
          >gin
        </h3>
        <div
          class="d-flex gap-2 align-items-center border-bottom border-2 w-100"
        >
          <i class="bi bi-envelope"></i>
          <input
            type="email"
            name="email"
            id="loginemail"
            placeholder="Enter your email"
            class="border-0 bg-light w-100"
            style="outline: none"
          />
        </div>
        <div
          class="d-flex gap-2 align-items-center border-bottom border-2 w-100"
        >
          <i class="bi bi-lock"></i>
          <input
            type="password"
            name="password"
            id="loginpassword"
            placeholder="Confirm a password"
            class="border-0 bg-light w-100"
            style="outline: none"
          />
          <i class="bi bi-eye"></i>
        </div>
        <div
          class="d-flex align-items-center justify-content-center gap-5 w-100"
        >
          <label><input type="checkbox" /> Remember me </label>
          <a class="text-decoration-none" href="#">Forgot password?</a>
        </div>

        <div class="d-flex align-items-center justify-content-center w-100">
          <button class="bg-primary border rounded-2 w-100 text-light p-2">
            Login Now
          </button>
        </div>

        <div class="d-flex gap-1 justify-content-center w-100">
          <p>
            Don't have an account?
            <a class="text-decoration-none" href="#">Signup now</a>
          </p>
        </div>
      </div>
      <div
        class="bg-light d-grid gap-4 p-4 align-items-center justify-content-center rounded-2 w-25 me-5 mb-5"
      >
        <h3 class="mb-3">
          <span
            class="bg-light text-decoration-underline link-underline-primary"
            >Re</span
          >gistration
        </h3>
        <div
          class="d-flex gap-2 align-items-center border-bottom border-2 w-100"
        >
          <i class="bi bi-person"></i>
          <input
            type="text"
            name="name"
            id="name"
            placeholder="Enter your name"
            class="border-0 bg-light w-100"
            style="outline: none"
          />
        </div>
        <div
          class="d-flex gap-2 align-items-center border-bottom border-2 w-100"
        >
          <i class="bi bi-envelope"></i>
          <input
            type="email"
            name="email"
            id="loginemail"
            placeholder="Enter your email"
            class="border-0 bg-light w-100"
            style="outline: none"
          />
        </div>
        <div
          class="d-flex gap-2 align-items-center border-bottom border-2 w-100"
        >
          <i class="bi bi-lock"></i>
          <input
            type="password"
            name="password"
            id="loginpassword"
            placeholder="Create a password"
            class="border-0 bg-light w-100"
            style="outline: none"
          />
        </div>
        <div
          class="d-flex gap-2 align-items-center border-bottom border-2 w-100"
        >
          <i class="bi bi-lock"></i>
          <input
            type="password"
            name="password"
            id="loginpassword"
            placeholder="Confirm a password"
            class="border-0 bg-light w-100"
            style="outline: none"
          />
          <i class="bi bi-eye"></i>
        </div>
        <div class="d-flex gap-2 align-items-center w-100">
          <input type="checkbox" />I accept all terms & conditions
        </div>
        <div class="d-flex align-items-center justify-content-center w-100">
          <button class="bg-primary border rounded-2 w-100 text-light p-2">
            Register Now
          </button>
        </div>

        <div class="d-flex gap-1 justify-content-center w-100">
          <p>
            Already have an account?
            <a class="text-decoration-none" href="#">Login now</a>
          </p>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
